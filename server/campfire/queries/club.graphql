query Club_Query(
    $clubId: ID!
) {
    club(id: $clubId) {
        id
        name
        game
        visibility
        amIMember
        avatarUrl
        badgeGrants
        createdByCommunityAmbassador
        address
        location
        members {
            totalCount
        }
        creator {
            id
            username
            displayName
            avatarUrl
            badges {
                badgeType
                alias
            }
        }
    }
}
