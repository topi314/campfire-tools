query ActiveEvents_Query(
    $clubId: ID!
    $first: Int!
    $after: String
    $membersFirst: Int!
) {
    club(id: $clubId) {
        id
        name
        game
        visibility
        avatarUrl
        badgeGrants
        createdByCommunityAmbassador
        address
        location
        members {
            totalCount
        }
        creator {
            id
            username
            displayName
            avatarUrl
            badges {
                badgeType
                alias
            }
        }
        activeFeed(first: $first, after: $after) {
            totalCount
            edges {
                node {
                    __typename
                    ... on Event {
                        id
                        name
                        visibility
                        address
                        location
                        coverPhotoUrl
                        mapPreviewUrl
                        details
                        eventTime
                        eventEndTime
                        rsvpStatus
                        createdByCommunityAmbassador
                        badgeGrants
                        topicId
                        discordInterested
                        game
                        creator {
                            id
                            username
                            displayName
                            avatarUrl
                            badges {
                                badgeType
                                alias
                            }
                        }
                        clubId
                        club {
                            id
                            name
                            game
                            visibility
                            avatarUrl
                            badgeGrants
                            createdByCommunityAmbassador
                            creator {
                                id
                                username
                                displayName
                                avatarUrl
                                badges {
                                    badgeType
                                    alias
                                }
                            }
                        }
                        checkedInMembersCount
                        members(first: $membersFirst) {
                            totalCount
                            edges {
                                node {
                                    id
                                    username
                                    displayName
                                    avatarUrl
                                    badges {
                                        badgeType
                                        alias
                                    }
                                }
                            }
                            pageInfo {
                                hasNextPage
                                endCursor
                            }
                        }
                        rsvpStatuses {
                            userId
                            rsvpStatus
                        }
                        isPasscodeRewardEligible
                        passcode
                        campfireLiveEventId
                        campfireLiveEvent {
                            id
                            checkInRadiusMeters
                            eventName
                            modalHeadingImageUrl
                            startTimestamp
                            endTimestamp
                            eventName
                            id
                            localEndTime
                            localStartTime
                            location {
                                latitude
                                longitude
                            }
                            restrictTaggingByLocation
                            geofenceRadiusMeters
                        }
                        commentCount
                        isSubscribed
                        commentsPermissions
                        commentsPreview {
                            id
                            body
                            createdAt
                            updatedAt
                            author {
                                id
                                username
                                displayName
                                avatarUrl
                                badges {
                                    badgeType
                                    alias
                                }
                            }
                        }
                    }
                }
                cursor
            }
            pageInfo {
                hasNextPage
                startCursor
                endCursor
            }
        }
    }
}


